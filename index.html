<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><title>STREET — Your world, your feed</title>
<style>
:root{--bg:#08090c;--glass:rgba(22,25,32,.78);--line:#ffffff18;--text:#f5f6f8;--muted:#929baa;--lime:#c5f879;--red:#ff687b}
*{box-sizing:border-box}body{margin:0;padding-bottom:100px;background:radial-gradient(ellipse at 12% 0%,#536b3b30,transparent 35%),radial-gradient(ellipse at 100% 35%,#344e7130,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(25px) saturate(155%);-webkit-backdrop-filter:blur(25px) saturate(155%);box-shadow:inset 0 1px #ffffff0b,0 15px 45px #0003}
header{height:64px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 max(15px,calc((100vw - 1080px)/2));background:#090b0fdc;border-bottom:1px solid var(--line);backdrop-filter:blur(25px)}
.brand{font-size:23px;font-weight:950;letter-spacing:-1.2px;display:flex;align-items:center;gap:9px;cursor:pointer}.mark{background:var(--lime);color:#101509;border-radius:10px;width:30px;height:30px;display:grid;place-items:center}.topright{display:flex;gap:9px;align-items:center}.iconbtn{width:39px;height:39px;border-radius:12px;border:1px solid var(--line);background:#ffffff09;color:white;font-size:19px}.avatar{width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,#405332,#1c2a3b);display:grid;place-items:center;color:var(--lime);font-weight:900;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}
main{width:min(1080px,100%);margin:auto;padding:25px 17px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:4px 0 22px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--lime);font-weight:900}.head h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1.7px;line-height:1.1;margin:7px 0 4px}.head p{margin:0;color:var(--muted)}.btn{border:0;border-radius:12px;background:var(--lime);color:#101509;font-weight:850;padding:11px 16px}.btn.soft{background:#ffffff0b;color:white;border:1px solid var(--line)}.btn.danger{background:#ff687b20;color:#ff9eaa;border:1px solid #ff687b40}.btn.small{padding:8px 11px;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(0,680px) 280px;gap:22px;justify-content:center}.tools{display:flex;gap:8px;margin-bottom:15px}.search{min-width:0;flex:1;background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:white;outline:none}.post{border-radius:19px;overflow:hidden;margin-bottom:17px}.posthead{display:flex;align-items:center;gap:10px;padding:14px}.postwho{flex:1;min-width:0}.postwho b{display:block}.muted{color:var(--muted);font-size:12px}.postmedia{width:100%;max-height:620px;object-fit:contain;background:#030405;display:block}.caption{padding:12px 15px 4px;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:5px;padding:7px 11px}.act{border:0;background:none;color:var(--text);border-radius:9px;padding:7px}.act.liked{color:var(--red)}.act.save{margin-left:auto}.comments{border-top:1px solid var(--line);padding:10px 14px 14px}.comment{font-size:13px;margin:6px 0;overflow-wrap:anywhere}.comment b{margin-right:6px}.commentform{display:flex;gap:7px;margin-top:9px}.commentform input{flex:1;min-width:0;background:#080a0f;border:1px solid var(--line);border-radius:10px;color:white;padding:9px}.commentform button{border:0;border-radius:10px;background:var(--lime);font-weight:800;padding:0 12px}
.side{padding:17px;border-radius:17px;margin-bottom:13px}.side h3{font-size:14px;margin:0 0 6px}.side p{font-size:12px;color:var(--muted);margin:0}.stat{font-size:27px;color:var(--lime);font-weight:950}.storyrow{display:flex;gap:13px;overflow:auto;padding:2px 0 16px;scrollbar-width:none}.story{text-align:center;flex:0 0 62px;color:var(--muted);font-size:11px;cursor:pointer}.ring{width:57px;height:57px;padding:3px;border-radius:50%;margin:0 auto 4px;background:linear-gradient(130deg,var(--lime),#8b9cff,#c77bff)}.ring .avatar{width:100%;height:100%;border:3px solid #141820}
.empty{text-align:center;padding:48px 20px;border:1px dashed #ffffff2b;border-radius:18px;color:var(--muted)}.empty b{display:block;color:white;font-size:18px}.section{padding:19px;border-radius:19px;margin-bottom:15px}.section h2{margin:0 0 9px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tile{aspect-ratio:1;background:#171b22;position:relative;overflow:hidden;cursor:pointer}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.play{position:absolute;right:8px;top:5px;text-shadow:0 2px 7px black}.profile{padding:20px;border-radius:20px;display:flex;align-items:center;gap:15px;margin-bottom:15px}.profile .avatar{width:70px;height:70px;font-size:24px}.profileinfo{flex:1;min-width:0}.profileinfo h2{margin:0;font-size:22px}.profileinfo p{margin:2px 0;color:var(--muted)}.stats{display:flex;gap:16px;font-size:13px;margin-top:8px}
.bottom{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(9px + env(safe-area-inset-bottom));width:min(540px,calc(100% - 20px));display:flex;gap:5px;padding:8px;border:1px solid #ffffff20;border-radius:19px;background:#151922d9;backdrop-filter:blur(30px) saturate(170%);box-shadow:0 15px 45px #0009}.nav{height:49px;flex:1;min-width:0;border:0;border-radius:13px;background:transparent;color:#aab0bd;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800}.nav i{font-style:normal;font-size:21px;line-height:1.2}.nav.active{color:var(--lime);background:#c5f87915}.nav.create{flex:0 0 65px;background:var(--lime);color:#101509}.nav.create i{font-size:24px}
.modalback,.auth{position:fixed;inset:0;z-index:40;background:#000c;display:grid;place-items:center;padding:15px}.modal{width:min(470px,100%);max-height:92vh;overflow:auto;padding:22px;border-radius:20px}.modal h2{margin:0}.sub{font-size:13px;color:var(--muted);margin:4px 0 17px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;background:#080a0f;border:1px solid var(--line);border-radius:11px;color:white;padding:11px;outline:none}.field textarea{min-height:85px;resize:vertical}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid var(--line);border-radius:12px;background:#ffffff09;color:white;padding:15px}.choice span{display:block;font-size:23px}.preview{width:100%;max-height:250px;object-fit:contain;background:#050608;border-radius:11px;margin-top:10px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;z-index:60;bottom:95px;left:50%;transform:translateX(-50%);background:var(--lime);color:#101509;font-weight:850;padding:10px 15px;border-radius:11px;white-space:nowrap;max-width:92vw}
.authbox{width:min(410px,100%);padding:25px;border-radius:22px}.authlogo{font-size:29px;font-weight:950;letter-spacing:-1px;margin-bottom:12px}.authlogo span{color:var(--lime)}.authbox h1{font-size:25px;margin:0}.authbox>p{color:var(--muted);font-size:13px;margin:5px 0 18px}.switch{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}.link{border:0;background:none;color:var(--lime);font-weight:850}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,680px)}.desktopside{display:none}}@media(max-width:520px){header{height:59px;padding:0 13px}main{padding:20px 11px}.head{align-items:flex-start;flex-direction:column}.head .btn{width:100%}.post{border-radius:16px}.postmedia{max-height:510px}.profile{padding:15px;gap:11px}.profile .avatar{width:59px;height:59px}.profileinfo h2{font-size:19px}.nav{height:48px}.nav.create{flex-basis:58px}.bottom{padding:7px;gap:4px}}
</style></head><body>
<header><div class="brand" id="brand"><span class="mark">S</span> STREET</div><div class="topright"><button class="iconbtn" id="searchTop">⌕</button><button class="iconbtn" id="activityTop">♡</button><div class="avatar" id="topAvatar">S</div></div></header>
<main id="app"></main>
<nav class="bottom"><button class="nav active" data-page="home"><i>⌂</i>Home</button><button class="nav" data-page="explore"><i>⌕</i>Explore</button><button class="nav create" data-page="create"><i>＋</i>Create</button><button class="nav" data-page="activity"><i>♡</i>Activity</button><button class="nav" data-page="profile"><i>◉</i>Profile</button></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<div class="auth hidden" id="auth"><div class="authbox glass"><div class="authlogo"><span>✳</span> STREET</div><h1 id="authTitle">Your world, your feed.</h1><p id="authDesc">Sign in to share moments and see what's happening.</p><form id="authForm"><div class="field" id="nameWrap"><label>Your name</label><input id="name" maxlength="32" placeholder="Your display name"></div><div class="field"><label>Username</label><input id="username" maxlength="22" autocomplete="username" required placeholder="username"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"></div><button class="btn" id="authSubmit" style="width:100%">Sign in</button></form><div class="switch" id="switchText">New to STREET? <button class="link" id="switchAuth">Create account</button></div><p class="muted" style="margin-top:16px">Prototype: account data is stored in this browser. Do not reuse a personal password.</p></div></div>
<script>
const DB='street_v3',STORE='posts',UK='street_users_v3',SK='street_session_v3';let db,me=null,page='home',mode='login',file=null,fileUrl=null,query='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function getUsers(){try{return JSON.parse(localStorage.getItem(UK)||'{}')}catch{return {}}}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function store(mode,fn){return new Promise((ok,no)=>{let tx=db.transaction(STORE,mode),r=fn(tx.objectStore(STORE));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
const all=()=>store('readonly',s=>s.getAll()).then(a=>a.sort((x,y)=>y.created-x.created)),add=p=>store('readwrite',s=>s.add(p)),put=p=>store('readwrite',s=>s.put(p)),del=id=>store('readwrite',s=>s.delete(id));
function ago(t){let m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'}
function avatar(u){return `<div class="avatar">${u?.avatar?`<img src="${esc(u.avatar)}">`:esc((u?.name||u?.username||'?')[0].toUpperCase())}</div>`}
async function hash(p,s){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:100000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function showAuth(m='login'){mode=m;$('auth').classList.remove('hidden');$('authTitle').textContent=m==='signup'?'Join the STREET community':'Your world, your feed.';$('authDesc').textContent=m==='signup'?'Create an account and start sharing.':'Sign in to see what is happening.';$('nameWrap').classList.toggle('hidden',m!=='signup');$('authSubmit').textContent=m==='signup'?'Create account':'Sign in';$('switchText').innerHTML=m==='signup'?'Already have an account? <button class="link" id="switchAuth">Sign in</button>':'New to STREET? <button class="link" id="switchAuth">Create account</button>';$('switchAuth').onclick=()=>showAuth(mode==='signup'?'login':'signup')}
$('authForm').onsubmit=async e=>{e.preventDefault();let u=$('username').value.trim().toLowerCase(),p=$('password').value,allU=getUsers();if(!/^[a-z0-9_.-]{3,22}$/.test(u)){toast('Username: 3–22 letters, numbers, . _ or -');return}if(p.length<8){toast('Use at least 8 characters');return}if(mode==='signup'){if(allU[u]){toast('Username already exists');return}let salt=crypto.randomUUID();allU[u]={username:u,name:$('name').value.trim()||u,salt,hash:await hash(p,salt),bio:'',avatar:null};localStorage.setItem(UK,JSON.stringify(allU))}else if(!allU[u]||allU[u].hash!==await hash(p,allU[u].salt)){toast('Incorrect username or password');return}me=allU[u];sessionStorage.setItem(SK,u);$('auth').classList.add('hidden');top();render();toast('Welcome to STREET')};
function top(){$('topAvatar').innerHTML=me?.avatar?`<img src="${esc(me.avatar)}">`:esc((me?.name||'S')[0].toUpperCase())}
function go(p){if(p==='create'){create();return}page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));$('brand').onclick=()=>go('home');$('searchTop').onclick=()=>go('explore');$('activityTop').onclick=()=>go('activity');$('topAvatar').onclick=()=>go('profile');
function head(k,t,d,btn=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>${btn}</div>`}
function card(p){let liked=(p.likes||[]).includes(me.username),saved=(p.saved||[]).includes(me.username),url=URL.createObjectURL(p.file);return `<article class="post glass" data-id="${p.id}"><div class="posthead">${avatar({name:p.name,avatar:p.avatar})}<div class="postwho"><b>${esc(p.name)}</b><span class="muted">@${esc(p.username)} · ${ago(p.created)}</span></div><button class="act" data-a="more">•••</button></div>${p.type==='video'?`<video class="postmedia" src="${url}" controls playsinline></video>`:`<img class="postmedia" src="${url}" alt="Post by ${esc(p.name)}">`}<div class="actions"><button class="act ${liked?'liked':''}" data-a="like">${liked?'♥':'♡'} ${p.likes?.length||0}</button><button class="act" data-a="comment">◯ ${p.comments?.length||0}</button><button class="act save" data-a="save">${saved?'▣ Saved':'▢ Save'}</button></div>${p.caption?`<div class="caption">${esc(p.caption)}</div>`:''}<div class="muted" style="padding:2px 15px 10px">Shared on STREET</div><div class="comments">${(p.comments||[]).slice(-3).map(c=>`<div class="comment"><b>${esc(c.name)}</b>${esc(c.text)}</div>`).join('')}<form class="commentform"><input maxlength="240" required placeholder="Add a comment…"><button>Post</button></form></div></article>`}
async function bind(){document.querySelectorAll('[data-id]').forEach(el=>{let id=+el.dataset.id;el.querySelector('[data-a=like]').onclick=async()=>{let p=(await all()).find(x=>x.id===id);p.likes=p.likes||[];p.likes=p.likes.includes(me.username)?p.likes.filter(x=>x!==me.username):[...p.likes,me.username];await put(p);render()};el.querySelector('[data-a=save]').onclick=async()=>{let p=(await all()).find(x=>x.id===id);p.saved=p.saved||[];p.saved=p.saved.includes(me.username)?p.saved.filter(x=>x!==me.username):[...p.saved,me.username];await put(p);render()};el.querySelector('[data-a=comment]').onclick=()=>el.querySelector('.commentform input').focus();el.querySelector('.commentform').onsubmit=async e=>{e.preventDefault();let text=e.currentTarget.querySelector('input').value.trim();if(!text)return;let p=(await all()).find(x=>x.id===id);p.comments=p.comments||[];p.comments.push({name:me.name,username:me.username,text,created:Date.now()});await put(p);render()};el.querySelector('[data-a=more]').onclick=()=>options(id)})}
function modal(s){$('modalRoot').innerHTML=`<div class="modalback" id="back"><div class="modal glass">${s}</div></div>`;$('back').onclick=e=>{if(e.target.id==='back')close()}}
function close(){$('modalRoot').innerHTML=''}
async function options(id){let p=(await all()).find(x=>x.id===id),own=p.username===me.username;modal(`<h2>Post options</h2><p class="sub">Manage this post.</p>${own?'<button class="btn danger" id="remove" style="width:100%">Delete post</button>':'<button class="btn soft" id="report" style="width:100%">Report post</button>'}<div class="modalactions"><button class="btn soft" id="cancel">Close</button></div>`);$('cancel').onclick=close;if(own)$('remove').onclick=async()=>{await del(id);close();render();toast('Post deleted')};else $('report').onclick=()=>{close();toast('Report recorded in this demo')}}
async function render(){let ps=await all();if(page==='home'){let unique=[...new Map(ps.map(p=>[p.username,p])).values()];$('app').innerHTML=head('THE DAILY FEED','See what’s happening.','Fresh moments from your STREET community.',`<button class="btn" id="make">＋ Create post</button>`)+`<div class="layout"><section><div class="storyrow"><div class="story" id="storyAdd"><div class="ring"><div class="avatar">＋</div></div>Your story</div>${unique.slice(0,12).map(p=>`<div class="story"><div class="ring">${avatar({name:p.name,avatar:p.avatar})}</div>${esc(p.name.slice(0,9))}</div>`).join('')}</div><div>${ps.length?ps.map(card).join(''):'<div class="empty"><b>Your feed starts here.</b>Share the first photo or video.</div>'}</div></section><aside class="desktopside"><div class="side glass"><h3>Your STREET snapshot</h3><p>Posts shared by you</p><div class="stat">${ps.filter(p=>p.username===me.username).length}</div></div><div class="side glass"><h3>Community reminder</h3><p>Share respectfully. Only upload content you have permission to share and avoid private details.</p></div></aside></div>`;$('make').onclick=create;$('storyAdd').onclick=create;await bind()}
 if(page==='explore'){let list=ps.filter(p=>(p.caption+' '+p.username+' '+p.name).toLowerCase().includes(query));$('app').innerHTML=head('DISCOVER','Explore STREET','Search people, captions, photos and videos.')+`<div class="tools"><input class="search" id="q" placeholder="Search STREET…" value="${esc(query)}"><button class="btn soft" id="clear">Clear</button></div><div class="grid">${list.map(p=>`<div class="tile" data-open="${p.id}">${p.type==='video'?`<video src="${URL.createObjectURL(p.file)}" muted></video><span class="play">▶</span>`:`<img src="${URL.createObjectURL(p.file)}">`}</div>`).join('')}</div>${list.length?'':'<div class="empty"><b>No posts found.</b>Try a different search.</div>'}`;$('q').oninput=e=>{query=e.target.value;let v=e.target.selectionStart;render().then(()=>$('q').setSelectionRange(v,v))};$('clear').onclick=()=>{query='';render()};document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{let id=+x.dataset.open;go('home');setTimeout(()=>$(`[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth'}),100)})}
 if(page==='activity'){let items=[];ps.forEach(p=>(p.comments||[]).filter(c=>c.username===me.username).forEach(c=>items.push({c,p})));$('app').innerHTML=head('YOUR UPDATES','Activity','Your recent conversations.')+`<div class="section glass"><h2>Recent activity</h2>${items.length?items.sort((a,b)=>b.c.created-a.c.created).map(x=>`<p>💬 You commented on @${esc(x.p.username)}’s post <span class="muted">· ${ago(x.c.created)}</span><br><span class="muted">${esc(x.c.text)}</span></p>`).join('<hr style="border-color:var(--line)">'):'<div class="empty"><b>It’s quiet for now.</b>Your comments will appear here.</div>'}</div>`}
 if(page==='profile'){let mine=ps.filter(p=>p.username===me.username),saved=ps.filter(p=>(p.saved||[]).includes(me.username));$('app').innerHTML=`<div class="profile glass">${avatar(me)}<div class="profileinfo"><h2>${esc(me.name)}</h2><p>@${esc(me.username)}</p><div class="stats"><span><b>${mine.length}</b> posts</span><span><b>${saved.length}</b> saved</span></div></div><button class="btn soft small" id="edit">Edit</button></div><div class="section glass"><h2>About</h2><p class="muted">${esc(me.bio||'No bio yet. Add a little introduction.')}</p></div><div class="section glass"><h2>Your posts</h2><div class="grid">${mine.map(p=>`<div class="tile" data-open="${p.id}">${p.type==='video'?`<video src="${URL.createObjectURL(p.file)}" muted></video>`:`<img src="${URL.createObjectURL(p.file)}">`}</div>`).join('')}</div>${mine.length?'':'<p class="muted">Your posts will appear here.</p>'}</div><div class="section glass"><h2>Saved posts</h2><div class="grid">${saved.map(p=>`<div class="tile" data-open="${p.id}">${p.type==='video'?`<video src="${URL.createObjectURL(p.file)}" muted></video>`:`<img src="${URL.createObjectURL(p.file)}">`}</div>`).join('')}</div></div><button class="btn danger" id="logout">Log out</button>`;$('edit').onclick=editProfile;$('logout').onclick=()=>{sessionStorage.removeItem(SK);me=null;showAuth('login')};document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{go('home');setTimeout(()=>$(`[data-id="${x.dataset.open}"]`)?.scrollIntoView({behavior:'smooth'}),100)})}}
function editProfile(){modal(`<h2>Edit profile</h2><p class="sub">Update your STREET identity.</p><div class="field"><label>Display name</label><input id="editName" value="${esc(me.name)}"></div><div class="field"><label>Bio</label><textarea id="editBio" maxlength="150">${esc(me.bio||'')}</textarea></div><div class="field"><label>Profile photo</label><input type="file" id="editPhoto" accept="image/*"></div><div class="modalactions"><button class="btn soft" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div>`);$('cancel').onclick=close;$('save').onclick=async()=>{me.name=$('editName').value.trim()||me.username;me.bio=$('editBio').value.trim();let f=$('editPhoto').files[0];if(f){if(f.size>2*1024*1024){toast('Photo must be under 2 MB');return}me.avatar=await new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})}let u=getUsers();u[me.username]=me;localStorage.setItem(UK,JSON.stringify(u));close();top();render();toast('Profile updated')}}
function create(){if(!me){showAuth('login');toast('Sign in to create a post');return}file=null;modal(`<h2>Create a post</h2><p class="sub">Share a photo or video with your community.</p><div class="choices"><button class="choice" id="camera"><span>📷</span>Camera</button><button class="choice" id="gallery"><span>▧</span>Gallery</button></div><input class="hidden" type="file" id="camFile" accept="image/*,video/*" capture="environment"><input class="hidden" type="file" id="galFile" accept="image/*,video/*"><div id="preview"></div><div class="field"><label>Caption</label><textarea id="caption" maxlength="500" placeholder="What’s happening?"></textarea></div><p class="muted">Maximum file size: 25 MB. This prototype stores media on this device.</p><div class="modalactions"><button class="btn soft" id="cancel">Cancel</button><button class="btn" id="publish" disabled>Share post</button></div>`);$('cancel').onclick=close;$('camera').onclick=()=>$('camFile').click();$('gallery').onclick=()=>$('galFile').click();$('camFile').onchange=e=>choose(e.target.files[0]);$('galFile').onchange=e=>choose(e.target.files[0]);$('publish').onclick=publish}
function choose(f){if(!f)return;if(!f.type.startsWith('image/')&&!f.type.startsWith('video/')){toast('Choose an image or video');return}if(f.size>25*1024*1024){toast('Choose a file under 25 MB');return}file=f;if(fileUrl)URL.revokeObjectURL(fileUrl);fileUrl=URL.createObjectURL(f);let el=document.createElement(f.type.startsWith('video/')?'video':'img');el.src=fileUrl;el.className='preview';if(el.tagName==='VIDEO'){el.controls=true;el.playsInline=true}$('preview').replaceChildren(el);$('publish').disabled=false}
async function publish(){if(!file)return;$('publish').disabled=true;try{await add({username:me.username,name:me.name,avatar:me.avatar||null,caption:$('caption').value.trim(),type:file.type.startsWith('video/')?'video':'image',file,created:Date.now(),likes:[],saved:[],comments:[]});close();go('home');toast('Post shared on this device')}catch(e){toast('Could not save: browser storage may be full')}finally{$('publish').disabled=false}}
(async()=>{try{if(!crypto.subtle||!indexedDB)throw 0;db=await openDB();let u=getUsers(),s=sessionStorage.getItem(SK);if(s&&u[s]){me=u[s];top();await render()}else showAuth('login')}catch(e){$('app').innerHTML='<div class="empty"><b>STREET could not start.</b>Use an updated browser with site storage enabled.</div>'}})();
